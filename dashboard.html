<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amara Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <span class="mark" id="mark">Mp</span>
    <div class="who">
      <b id="couple"></b>
      <small id="when"></small>
    </div>
    <button class="btn ghost" type="button" id="refresh">Refresh</button>
  </div>
</header>

<main class="shell">
  <section class="gate" id="gate">
    <h1>Guest list</h1>
    <p>Enter the web app address from your Apps Script deployment and the key you
      set in the script. They stay on this device.</p>
    <label class="lbl" for="endpoint">Web app address</label>
    <input type="text" id="endpoint" placeholder="https://script.google.com/macros/s/..." autocomplete="off">
    <label class="lbl" for="key">Dashboard key</label>
    <input type="password" id="key" autocomplete="off">
    <div class="row">
      <button class="btn" type="button" id="connect">Open</button>
      <button class="btn ghost" type="button" id="forget" hidden>Forget this device</button>
    </div>
    <p class="status" id="gate-status" role="status" aria-live="polite"></p>
  </section>

  <section id="board" hidden>
    <div class="tiles">
      <div class="tile"><b id="t-going">0</b><span>Attending</span></div>
      <div class="tile"><b id="t-not">0</b><span>Cannot come</span></div>
      <div class="tile"><b id="t-wait">0</b><span>No reply yet</span></div>
      <div class="tile"><b id="t-invited">0</b><span>Invited</span></div>
    </div>

    <div class="split">
      <div class="card">
        <h2>Dinner count</h2>
        <div class="bars" id="meals"></div>
      </div>
      <div class="card">
        <h2>Replies over time</h2>
        <div class="spark" id="spark"></div>
        <p class="hint" id="last-reply"></p>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Parties</h2>
        <div class="tools">
          <input type="search" id="find" placeholder="Search a name" autocomplete="off">
          <select id="filt">
            <option value="all">Everyone</option>
            <option value="yes">Attending</option>
            <option value="no">Cannot come</option>
            <option value="wait">No reply yet</option>
          </select>
          <button class="btn ghost" type="button" id="csv">Export CSV</button>
        </div>
      </div>
      <div class="rows" id="rows"></div>
      <p class="hint" id="count-line"></p>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Photos from guests</h2>
        <span class="hint" id="upload-count"></span>
      </div>
      <div class="files" id="files"></div>
    </div>

    <div class="card">
      <h2>Notes and song requests</h2>
      <div class="notes" id="msgs"></div>
    </div>
  </section>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
